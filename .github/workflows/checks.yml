name: 🧪 SB · Test & Typecheck
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: sandbox-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/setup-pnpm@main
        with:
          node-version: '22'
      - name: Typecheck
        id: types
        run: pnpm typecheck
      - name: Tests
        if: ${{ !cancelled() && (steps.types.outcome == 'success' || steps.types.outcome == 'failure') }}
        run: pnpm test
      - name: Summary
        if: always()
        uses: rodkisten/github/ci-summary@main
        with:
          title: RodSandbox checks
          status: ${{ job.status }}
