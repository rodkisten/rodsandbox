name: 🧪 SB · Test & Typecheck
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: sandbox-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    uses: rodkisten/github/.github/workflows/node-ci.yml@main
    with:
      node-version: '22'
      test-command: pnpm test
      build-command: pnpm typecheck
      run-tests: true
      run-build: true
