name: ☁️ SB · Cloudflare
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/setup-pnpm@main
        with:
          node-version: '22'
      - name: Validate and build browser application
        run: |
          pnpm typecheck
          pnpm test
          pnpm run build:browser
          test -f dist/index.html
      - name: Deploy
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-config.mjs
          pnpm dlx wrangler@4 deploy --config wrangler.generated.json
      - name: Verify deployment
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          host=sandbox.migos.club
          if [ -n "$PR_NUMBER" ]; then host="pr-$PR_NUMBER.$host"; fi
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$host/api/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "https://$host/" -o /tmp/sandbox-preview.html
      - name: Update preview comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- rodsandbox-cloudflare-preview -->'
          body="$(printf '%s\n☁️ RodSandbox preview\n\nhttps://pr-%s.sandbox.migos.club\n\nSHA: `%s`' "$marker" "$PR_NUMBER" "$GITHUB_SHA")"
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- rodsandbox-cloudflare-preview -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --name "rodsandbox-pr-$PR_NUMBER" --force
