name: 🪩 SB · CI & Deploy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime-agent:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/setup-pnpm@main
        with:
          node-version: '24'
      - name: Typecheck, build and verify private runtime agent
        run: pnpm --filter @rodsandbox/runtime-agent typecheck && pnpm --filter @rodsandbox/runtime-agent build && pnpm --filter @rodsandbox/runtime-agent test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/runtime-agent/Dockerfile
          push: false
          load: true
          tags: rodsandbox-runtime-agent:ci
      - name: Smoke Node API in the built image
        env:
          CONTAINER: runtime-agent-ci-${{ github.run_id }}
          VOLUME: runtime-agent-state-ci-${{ github.run_id }}
        run: |
          printf '{"schemaVersion":1,"targets":[]}' > "$RUNNER_TEMP/runtime-policy.json"
          trap 'docker rm --force "$CONTAINER" >/dev/null 2>&1 || true; docker volume rm "$VOLUME" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$CONTAINER" --read-only --tmpfs /tmp:rw,noexec,nosuid,size=67108864 \
            --cap-drop ALL --security-opt no-new-privileges --memory 256m --cpus .25 --pids-limit 128 \
            --publish 127.0.0.1:19183:9183 --mount "type=bind,source=$RUNNER_TEMP/runtime-policy.json,target=/etc/runtime/policy.json,readonly" \
            --mount "type=volume,source=$VOLUME,target=/var/lib/rodsandbox-runtime" \
            --env RUNTIME_AGENT_TOKEN=ci-fixture-only-not-a-production-secret --env RUNTIME_POLICY_FILE=/etc/runtime/policy.json \
            rodsandbox-runtime-agent:ci
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:19183/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19183/v1/workspaces/rodverse/targets/probe)" = 401
          echo 'Private agent image: health reachable, unauthorized target request rejected' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-agent-node-${{ github.sha }}
          path: packages/runtime-agent/dist
          retention-days: 14
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MODULE_SHA: ${{ github.sha }}
      RUNTIME_BROKER_SERVICE: ${{ vars.RUNTIME_BROKER_SERVICE }}
      RUNTIME_AGENT_URL: ${{ vars.RUNTIME_AGENT_URL }}
      RUNTIME_ACCESS_TEAM_DOMAIN: ${{ vars.RUNTIME_ACCESS_TEAM_DOMAIN }}
      RUNTIME_ACCESS_AUD: ${{ vars.RUNTIME_ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: rodkisten/github/setup-pnpm@main
        with:
          node-version: '22'
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build browser application
        run: |
          pnpm run build:browser
          test -f dist/index.html
          export MODULE_ORIGIN=https://sandbox.migos.club
          if [ -n "$PR_NUMBER" ]; then export MODULE_ORIGIN="https://pr$PR_NUMBER.sandbox.migos.club"; fi
          pnpm run build:module
          test -f "dist/modules/sandbox/$MODULE_SHA/mf-manifest.json"
          mkdir -p module-archive/sandbox
          cp -a "dist/modules/sandbox/$MODULE_SHA" module-archive/sandbox/
      - name: Retain prior modules for rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/retain-modules.mjs
      - name: Archive current immutable module
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'main' }}-module-${{ env.MODULE_SHA }}
          path: module-archive/
          overwrite: true
          retention-days: 30
      - name: Deploy
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-config.mjs
          pnpm exec wrangler deploy --config wrangler.generated.json
      - name: Verify deployment
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        run: |
          host=sandbox.migos.club
          if [ -n "$PR_NUMBER" ]; then host="pr$PR_NUMBER.$host"; fi
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "https://$host/api/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "https://$host/" -o /tmp/sandbox-preview.html
          MODULE_ORIGIN="https://$host" node scripts/verify-module.mjs
      - name: Update preview comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- rodsandbox-cloudflare-preview -->'
          body=$(printf '%s\n☁️ RodSandbox preview\n\nhttps://pr%s.sandbox.migos.club\n\nSHA: %s\nBuild: https://github.com/%s/actions/runs/%s\nManifest: https://pr%s.sandbox.migos.club/rod-module.json' "$marker" "$PR_NUMBER" "$MODULE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$PR_NUMBER")
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- rodsandbox-cloudflare-preview -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
      - name: Summary
        if: always()
        uses: rodkisten/github/ci-summary@main
        with:
          title: RodSandbox CI & Deploy
          status: ${{ job.status }}
  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 delete --name "rodsandbox-pr-$PR_NUMBER" --force
